    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Manrope"', 'system-ui', 'sans-serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'monospace'],
            },
            colors: {
              sage: {
                primary:       '#55745C',  // Primary Sage
                'primary-hover': '#405A46', // Primary Dark / Hover
                soft:          '#EEF4EF',  // Primary Soft
                bg:            '#FBFAF7',  // Warm White / Main Background
                surface:       '#FFFFFF',  // Pure White / Cards
                'surface-2':   '#F4F5F2',  // Soft Surface
                text:          '#202A24',  // Main Text
                sec:           '#5F6861',  // Secondary Text
                muted:         '#7B827D',  // Muted Text
                border:        '#DDE3DE',  // Border
                accent:        '#3B82F6',  // Secondary Blue
                'accent-soft': '#EFF6FF',  // Secondary Blue Soft
                'accent-hover': '#2563EB',  // Darker Blue
              }
            },
            boxShadow: {
              'soft': '0 2px 8px -2px rgba(85, 116, 92, 0.05), 0 4px 16px -4px rgba(85, 116, 92, 0.03)',
              'medium': '0 4px 16px -4px rgba(85, 116, 92, 0.08), 0 8px 32px -8px rgba(85, 116, 92, 0.04)',
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '2.5rem',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg:            #FBFAF7; /* Warm White */
        --color-surface:       #FFFFFF; /* Pure White */
        --color-surface-2:     #F4F5F2; /* Soft Surface */
        --color-primary:       #55745C; /* Primary Sage */
        --color-primary-hover: #405A46; /* Primary Dark */
        --color-text:          #202A24; /* Main Text */
        --color-text-sec:      #5F6861; /* Secondary Text */
        --color-text-muted:    #7B827D; /* Muted Text */
        --color-accent:        #3B82F6; /* Secondary Blue */
        --color-accent-hover:  #2563EB; /* Darker Blue */
        --color-border:        #DDE3DE; /* Border */
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 120px;
      }
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
      }
      /* Hide scrollbar for clean horizontal scrolls if needed */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      .shimmer::after {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.04) 20%,
          rgba(255, 255, 255, 0.08) 60%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 1.8s infinite;
        content: '';
      }
    </style>
