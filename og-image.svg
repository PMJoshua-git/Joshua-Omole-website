<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c75a5"/>
      <stop offset="100%" stop-color="#554182"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e142c"/>
  
  <!-- Decorative Elements -->
  <circle cx="0" cy="0" r="400" fill="url(#grad)" opacity="0.1"/>
  <circle cx="1200" cy="630" r="400" fill="url(#grad)" opacity="0.1"/>
  
  <!-- Content Container -->
  <g transform="translate(600, 315)" text-anchor="middle">
    <!-- Logo/Icon representation -->
    <circle cx="0" cy="-80" r="40" fill="url(#grad)"/>
    <text x="0" y="-70" font-family="serif" font-weight="bold" font-style="italic" font-size="32" fill="white">J.O</text>
    
    <!-- Main Title -->
    <text x="0" y="20" font-family="serif" font-weight="bold" font-size="64" fill="white">Joshua Omole</text>
    
    <!-- Subtitle -->
    <text x="0" y="80" font-family="sans-serif" font-weight="400" font-size="32" fill="#9a9aaa" letter-spacing="1">AI Integration Specialist</text>
    <text x="0" y="125" font-family="sans-serif" font-weight="400" font-size="32" fill="#9a9aaa" letter-spacing="1">& IT Project Manager</text>
  </g>
</svg>